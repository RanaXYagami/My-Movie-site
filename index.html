<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineFlix - Watch Free Movies Online</title>
    <meta name="description" content="Watch HD movies online for free on CineFlix. Stream latest Hollywood and Bollywood releases.">
    <meta name="keywords" content="cineflix, free movies, watch hd movies, online streaming">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f1015; color: #ffffff; padding-bottom: 50px; }
        header { background-color: #181a20; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e50914; }
        .logo { font-size: 26px; font-weight: bold; color: #e50914; }
        .logo span { color: #fff; }
        .hero { text-align: center; padding: 40px 20px; background: #181a20; margin-bottom: 30px; border-bottom: 1px solid #262932; }
        .hero h1 { font-size: 32px; margin-bottom: 10px; }
        .hero p { color: #aaa; font-size: 16px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .section-title { font-size: 22px; margin-bottom: 20px; border-left: 4px solid #e50914; padding-left: 10px; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
        .movie-card { background-color: #181a20; border-radius: 8px; overflow: hidden; cursor: pointer; border: 1px solid #262932; transition: 0.3s; }
        .movie-card:hover { transform: translateY(-6px); border-color: #e50914; box-shadow: 0 8px 20px rgba(229, 9, 20, 0.3); }
        .poster-container { width: 100%; height: 260px; overflow: hidden; position: relative; background: #262932; }
        .poster-container img { width: 100%; height: 100%; object-fit: cover; }
        .rating { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.85); color: #f1c40f; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .movie-info { padding: 12px; }
        .movie-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .movie-meta { font-size: 12px; color: #888; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #181a20; width: 90%; max-width: 750px; border-radius: 10px; overflow: hidden; border: 1px solid #262932; }
        .modal-header { padding: 15px 20px; display: flex; justify-content: space-between; background: #262932; align-items: center; }
        .close-btn { font-size: 26px; cursor: pointer; color: #fff; line-height: 1; }
        .close-btn:hover { color: #e50914; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Cine<span>Flix</span></div>
    </header>

    <div class="hero">
        <h1>Welcome to CineFlix</h1>
        <p>Watch HD Movies & TV Shows Anywhere</p>
    </div>

    <div class="container">
        <h2 class="section-title">Latest Releases</h2>

        <div class="movie-grid">

            <div class="movie-card" onclick="openPlayer('Avengers: Endgame', 'https://www.youtube.com/embed/dQw4w9WgXcQ')">
                <div class="poster-container">
                    <img src="https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e921Sq3P31x.jpg" alt="Avengers Endgame">
                    <div class="rating">★ 8.4</div>
                </div>
                <div class="movie-info">
                    <div class="movie-title">Avengers: Endgame</div>
                    <div class="movie-meta">2019 • Action / Sci-Fi</div>
                </div>
            </div>

            <div class="movie-card" onclick="openPlayer('Spider-Man: No Way Home', 'https://www.youtube.com/embed/dQw4w9WgXcQ')">
                <div class="poster-container">
                    <img src="https://image.tmdb.org/t/p/w500/1g0dhY23L9mS33u21Bf29A9P41.jpg" alt="Spider-Man No Way Home">
                    <div class="rating">★ 8.2</div>
                </div>
                <div class="movie-info">
                    <div class="movie-title">Spider-Man: No Way Home</div>
                    <div class="movie-meta">2021 • Action / Fantasy</div>
                </div>
            </div>

            <div class="movie-card" onclick="openPlayer('Avatar: The Way of Water', 'https://www.youtube.com/embed/dQw4w9WgXcQ')">
                <div class="poster-container">
                    <img src="https://image.tmdb.org/t/p/w500/t6822W81C32A1C32A1C32A1.jpg" alt="Avatar The Way of Water">
                    <div class="rating">★ 7.6</div>
                </div>
                <div class="movie-info">
                    <div class="movie-title">Avatar: The Way of Water</div>
                    <div class="movie-meta">2022 • Sci-Fi / Adventure</div>
                </div>
            </div>

        </div>
    </div>

    <div id="videoModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Movie Title</h3>
                <span class="close-btn" onclick="closePlayer()">&times;</span>
            </div>
            <div class="video-container">
                <iframe id="videoIframe" src="" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        function openPlayer(title, embedUrl) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('videoIframe').src = embedUrl;
            document.getElementById('videoModal').style.display = 'flex';
        }
        function closePlayer() {
            document.getElementById('videoModal').style.display = 'none';
            document.getElementById('videoIframe').src = '';
        }
    </script>
</body>
</html>
